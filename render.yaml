services:
  - type: web
    name: digital-threat-dashboard
    runtime: python
    plan: free
    branch: dash-dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
